<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact | Mane Textiles</title>
    <meta name="description" content="Mane Textiles: premium linens, fabrics and clothing materials in Lagos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Newsreader:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="contact">
    <main class="wrap">
        <div class="ph">
            <h1>Contact us</h1>
        </div>
        <div class="two">
            <div>
                <p class="lead">Send us a message and it opens straight in WhatsApp, so you get a quick reply.</p>
                <p><b>Visit</b><br>Balogun Market, Lagos Island, Lagos</p>
                <p><b>Call</b><br>+234 800 000 0000</p>
                <p><b>Hours</b><br>Monday to Saturday, 8am to 6pm</p>
            </div>
            <form id="cf"><input name="n" placeholder="Your name" required><textarea name="m" rows="5"
                    placeholder="What are you looking for?" required></textarea><button class="btn w">Send on
                    WhatsApp</button></form>
        </div>
    </main>
    <script src="app.js"></script>
</body>

</html>
