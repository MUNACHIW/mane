<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop | Mane Textiles</title>
    <meta name="description" content="Mane Textiles: premium linens, fabrics and clothing materials in Lagos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">

        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Newsreader:wght@400;500&display=swap"

<body data-page="shop">

        <div class="ph">
